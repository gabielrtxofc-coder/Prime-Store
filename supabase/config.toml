# Configuração do projeto Supabase para desenvolvimento local (Supabase CLI).
# Não contém segredos. Os valores de ambiente reais ficam em .env (ignorado pelo git).
project_id = "prime-store"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 2

[functions.catalog]
verify_jwt = false

[functions.create-order]
verify_jwt = false

[functions.order-status]
verify_jwt = false

[functions.delivery]
verify_jwt = false

[functions.mp-webhook]
verify_jwt = false

[functions.wyvi-webhook]
verify_jwt = false

# wyvi-worker: processamento privilegiado da fila de eventos. verify_jwt
# permanece LIGADO (plataforma valida o JWT) e o handler exige o claim
# role=service_role — o job pg_cron (migração 0044) envia o JWT service_role
# lido do Vault. O modo auth:'secret' (sb_secret em apikey) foi avaliado e
# descartado: o valor das chaves sb_secret é mascarado na API de gestão.
[functions.wyvi-worker]
verify_jwt = true

[functions.admin-api]
verify_jwt = true

[functions.demo-payment]
verify_jwt = false

[functions.order-request]
verify_jwt = false

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------
# Endpoints públicos (catalog, create-order, order-status, delivery,
# demo-payment, order-request) rodam com verify_jwt = false: o gateway não
# exige Authorization e a proteção vem das regras no banco (nenhum GRANT para
# anon) e da validação no handler.
# admin-api exige JWT: a autorização real é feita por assert_admin() no banco
# (allowlist + AAL2). mp-webhook não recebe JWT do Mercado Pago: a
# autenticidade é validada pela assinatura x-signature no próprio handler.
# Estado conferido com o remoto na Missão 13: só admin-api tem verify_jwt=true
# (as 8 funções publicadas na Missão 12); wyvi-worker (criada na Missão 14)
# também roda com verify_jwt=true — ver bloco acima.
